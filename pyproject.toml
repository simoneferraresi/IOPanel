[project]
name = "IOPanel"
version = "0.3.0"
description = "A robust GUI for controlling photonics lab equipment, including cameras and wavelength scanners."
authors = [
    { name = "Simone Ferraresi", email = "simone.ferraresi@unife.it" },
]
readme = "README.md"
license = { file = "LICENSE" } # Changed from 'text' to 'file' to point to your new LICENSE file
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
]

# --- Core Dependencies ---
# These are required for the application to run.
dependencies = [
    "PySide6==6.12.0",
    "numpy>=1.23.0",
    "pyqtgraph>=0.13.0",
    "scipy>=1.9.0", # For .mat file saving
    "opencv-python-headless>=4.7.0", # Headless version is smaller and sufficient
    "pydantic>=2.0.0", # For robust configuration management
    "pyserial>=3.5", # Piezo controller serial-port discovery and communication
    "PyOpenGL>=3.1.6", # pyqtgraph.opengl widgets used by the alignment panel
    "pyvisa==1.16.2", # Read-only EDFA GPIB support; requires separate native VISA provider
]

[project.optional-dependencies]
# --- Opt-in testing and developer tooling only ---
test = [
    "pytest>=8.0.0",
    "pytest-qt>=4.0.0",
    "pytest-cov>=4.0.0", # For checking test coverage
]
dev = [
    "pre-commit>=3.0.0",
    "PyInstaller>=6.0.0",
]
typecheck = [
    "pyright[nodejs]==1.1.414",
]
lint = [
    "ruff==0.17.1",
]

# Install these integrations by default with 'uv sync' on the supported
# Windows x64 / CPython 3.12 lab profile. They remain external to the
# hardware-independent core to preserve driver-free CI and packaging.
[dependency-groups]
lab = [
    "vmbpy==1.2.2; sys_platform == 'win32' and platform_machine == 'AMD64'",
    "matlabengine==24.2.2; sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv.dependency-groups]
lab = { requires-python = ">=3.12,<3.13" }

[project.urls]
Homepage = "https://github.com/simoneferraresi/IOPanel"
"Bug Tracker" = "https://github.com/simoneferraresi/IOPanel/issues"

# --- Tool Configuration ---

[tool.black]
line-length = 120
target-version = ['py312']

[tool.ruff]
# Set the lowest Python version you support.
target-version = "py312"
line-length = 120

# Exclude the auto-generated resources_rc.py file from linting.
exclude = [
    "resources/resources_rc.py",
    ".venv",
]

[tool.uv]
required-version = "==0.13.4"
# 'uv sync --locked' on the lab PC installs VmbPy and MATLAB Engine automatically.
# CI and driver-free users explicitly pass --no-default-groups.
default-groups = ["lab"]

[tool.pyright]
include = [
    "hardware/interfaces.py",
    "hardware/edfa_types.py",
    "hardware/edfa_gpib.py",
    "hardware/ipg_ead2kc.py",
    "logic/edfa_monitor.py",
    "ui/edfa_panel.py",
    "tools/edfa_readonly_probe.py",
    "hardware/dummy_edfa.py",
    "hardware/pm5020.py",
    "hardware/pm5020_types.py",
    "hardware/dummy_pm5020.py",
    "hardware/ct400.py",
    "hardware/dummy_ct400.py",
    "hardware/camera_init_worker.py",
    "hardware/ct400_init_worker.py",
    "hardware/camera_recovery_worker.py",
    "hardware/piezo_init_worker.py",
    "logic/task_runner.py",
    "logic/pm5020_monitor.py",
    "logic/scan_import.py",
    "ui/control_panel.py",
    "ui/pm5020_panel.py",
    "ui/log_console.py",
    "tools/check_environment.py",
    "tools/benchmark_startup.py",
    "tools/performance_baseline.py",
]
pythonVersion = "3.12"
pythonPlatform = "Windows"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
reportIncompatibleMethodOverride = "error"
reportImplicitOverride = "error"
