[project]
name = "IOPanel"
version = "0.3.0"
description = "A robust GUI for controlling photonics lab equipment, including cameras and wavelength scanners."
authors = [
    { name = "Simone Ferraresi", email = "simone.ferraresi@unife.it" },
]
readme = "README.md"
license = { file = "LICENSE" } # Changed from 'text' to 'file' to point to your new LICENSE file
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
]

# --- Core Dependencies ---
# These are required for the application to run.
dependencies = [
    "PySide6>=6.6.0",
    "numpy>=1.23.0",
    "pyqtgraph>=0.13.0",
    "scipy>=1.9.0", # For .mat file saving
    "opencv-python-headless>=4.7.0", # Headless version is smaller and sufficient
    "pydantic>=2.0.0", # For robust configuration management
    "pyserial>=3.5", # Piezo controller serial-port discovery and communication
    "PyOpenGL>=3.1.6", # pyqtgraph.opengl widgets used by the alignment panel
]

[project.optional-dependencies]
# --- Optional Dependencies ---
# Use this for features that are not strictly required, like MATLAB integration.
# To install: uv pip install -e ".[matlab]"
matlab = [
    "matlabengine", # The package name for the MATLAB Engine
]
camera = [
    "vmbpy>=1.0.5,<2", # Lab SDK-managed and packaged-wheel profiles are documented separately
]
test = [
    "pytest>=8.0.0",
    "pytest-qt>=4.0.0",
    "pytest-cov>=4.0.0", # For checking test coverage
]
dev = [
    "pre-commit>=3.0.0",
    "PyInstaller>=6.0.0",
]
typecheck = [
    "pyright[nodejs]==1.1.414",
]

[project.urls]
Homepage = "https://github.com/simoneferraresi/IOPanel"
"Bug Tracker" = "https://github.com/simoneferraresi/IOPanel/issues"

# --- Tool Configuration ---

[tool.black]
line-length = 120
target-version = ['py312']

[tool.ruff]
# Set the lowest Python version you support.
target-version = "py312"
line-length = 120

# A selection of good default rules.
# E/W -> pycodestyle, F -> Pyflakes, I -> isort (import sorting), UP -> pyupgrade
select = ["E", "F", "W", "I", "UP"]

# Exclude the auto-generated resources_rc.py file from linting.
exclude = [
    "resources/resources_rc.py",
    ".venv",
]

[tool.uv]
required-version = "==0.12.21"

[tool.pyright]
include = [
    "hardware/interfaces.py",
    "hardware/ct400.py",
    "hardware/dummy_ct400.py",
]
pythonVersion = "3.12"
pythonPlatform = "Windows"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
reportIncompatibleMethodOverride = "error"
reportImplicitOverride = "error"
