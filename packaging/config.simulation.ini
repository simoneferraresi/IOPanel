[App]
name = IOPanel

[Logging]
level = INFO
file = lab_app.log
max_bytes = 5242880
backup_count = 3

[Instruments]
ct400_backend = simulation

[Camera:Smoke]
enabled = true
identifier = SIMULATED-CAMERA-1
name = Simulated Camera
backend = simulation
simulation_width = 64
simulation_height = 48

[ScanDefaults]
start_wavelength_nm = 1550.0
end_wavelength_nm = 1560.0
resolution_pm = 1
speed_nm_s = 10
laser_power = 1.0
power_unit = mW
input_port = 1

[HistogramDefaults]
wavelength_nm = 1550.0
laser_power = 1.0
power_unit = mW
input_port = 1
detector_1_enabled = true
detector_2_enabled = true
detector_3_enabled = true
detector_4_enabled = true
