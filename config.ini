# IOPanel laboratory profile — Windows x64 / Python 3.12.
# Site-specific hardware paths and identifiers: not a portable or simulation profile.
# For driver-free testing/packaging, use packaging/config.simulation.ini.
# A configured physical backend does not necessarily connect automatically.

[App]
name = IOPanel

[Logging]
# Logging settings (overridden by command-line arguments if provided)
# level: DEBUG, INFO, WARNING, ERROR, CRITICAL
level = DEBUG
# file: Path to the log file
file = lab_app.log
# max_bytes: Max log file size before rotation (in bytes), e.g., 5242880 for 5 MB
max_bytes = 5242880
# backup_count: Number of backup log files to keep
backup_count = 3

[Instruments]
# CT400 — lab driver and explicit physical backend.
ct400_backend = physical
ct400_dll_path = C:/Users/bellanca/Matlab_Personale/LabOttica/Yenista/Matlab_PiezoController/CT400_lib.dll

# PM5020 — selected physical backend; connection is manual via Instruments menu.
# The replacement x64 DLL was qualified for full-buffer burst retrieval.
# See docs/pm5020-backend.md for its required SHA-256 and recovery limitations.
pm5020_backend = physical
pm5020_resource_name = USB0::0x1313::0x80BB::M01213392::INSTR
pm5020_wrapper_path = C:/Program Files (x86)/IVI Foundation/VISA/WinNT/TLPMX/Examples/Python/TLPMX.py
pm5020_dll_path = C:/Users/bellanca/AppData/Local/IOPanel/vendor/thorlabs-2025-11-14/TLPMX_64.dll

# IPG EDFA — keep in simulation until separately configured and approved.
edfa_backend = simulation

# TUNICS source controlled by CT400.
tunics_gpib_address = 10
tunics_laser_type = LS_TunicsT100s_HP

# Thorlabs piezo controller driver and legacy COM-port bindings.
piezo_dll_path = C:/Program Files (x86)/Thorlabs/MDT69XB/Sample/Thorlabs_MDT69XB_PythonSDK/MDT_COMMAND_LIB_x64.dll

piezo_left_serial = COM3
piezo_right_serial = COM5
# Optional stable USB-interface serial bindings, only after physical Left/Right confirmation.
# When specified, a missing/duplicate USB serial disables that side; it does NOT fall back to COM.
# These refer to the USB interface, which can be a serial adapter rather than the piezo controller.
# Use Instruments > Configure Piezo Controllers to inspect candidates and copy the exact keys.
# piezo_left_usb_serial =
# piezo_right_usb_serial =

[Camera:Top]
# Physical Vimba X camera; enabled cameras may initialize during GUI startup.
enabled = true
backend = vimba
identifier = DEV_000F315B9CE1
name = Top Camera
flip_horizontal = false

[Camera:Side]
# Physical Vimba X camera.
enabled = true
backend = vimba
identifier = DEV_000F315BA8F9
name = Side Camera
flip_horizontal = true

[ScanDefaults]
# Default values for the CT400 Wavelength Scan panel
start_wavelength_nm = 1530.0
end_wavelength_nm = 1565.0
resolution_pm = 1
speed_nm_s = 10
laser_power = 1.0
# power_unit: Default unit for laser power input ('mW' or 'dBm')
power_unit = mW
# input_port: Default laser input port (1-4)
input_port = 1
# CT400/TUNICS software-configured wavelength bounds (nm), not instrument readback.
min_wavelength_nm = 1440.0
max_wavelength_nm = 1640.0
# Used when disabling/parking the selected laser input; verify hardware safe state.
safe_parking_wavelength = 1550.0

[HistogramDefaults]
# Default values for the Power Monitor (Histogram) panel
wavelength_nm = 1550.0
laser_power = 1.0
power_unit = mW
input_port = 1
# detector_X_enabled: Default state for detector checkboxes (true/false)
detector_1_enabled = true
detector_2_enabled = true
detector_3_enabled = true
detector_4_enabled = true

[UI]
# Initial window size as a fraction of available screen width and height.
initial_width_ratio = 0.8
initial_height_ratio = 0.8
