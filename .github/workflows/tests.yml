name: Hardware-independent tests

on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:
    branches: [main]

jobs:
  hardware-independent:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
      - run: uv sync --locked --extra test --extra typecheck --extra lint
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - name: Temporary formatter diff for async export
        if: failure()
        run: uv run --no-sync ruff format --diff logic/scan_export_worker.py ui/plot_widgets.py ui/main_window.py tests/test_scan_export_async.py tests/test_plot_widgets.py tools/benchmark_scan_gui.py
      - run: uv run --no-sync pyright
      - run: uv run --no-sync pytest -vv --tb=short -o faulthandler_timeout=30
