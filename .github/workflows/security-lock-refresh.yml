# Temporary branch-scoped helper; delete after lockfile regeneration.
name: Refresh security lockfile
on:
  push:
    branches: [fix/dependabot-security-2026-10-24]
permissions:
  contents: write
jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.4"
      - name: Regenerate patched setuptools lock
        run: uv lock --upgrade-package setuptools
      - name: Verify lockfile
        run: uv lock --check
      - name: Verify patched versions
        shell: pwsh
        run: |
          @'
          import tomllib
          with open("uv.lock", "rb") as f:
              packages = {p["name"]: p["version"] for p in tomllib.load(f)["package"]}
          floors = {"filelock": (4, 2, 4), "virtualenv": (21, 14, 13), "setuptools": (84, 1, 0)}
          for name, floor in floors.items():
              v = tuple(map(int, packages[name].split(".")))
              assert v >= floor, (name, v, floor)
              print(name, packages[name])
          '@ | python -
      - name: Commit regenerated uv.lock
        shell: pwsh
        run: |
          if (git diff --quiet -- uv.lock) {
            Write-Output "Lockfile already current"
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- uv.lock
          git commit -m "Regenerate lock for setuptools security fix"
          git push
