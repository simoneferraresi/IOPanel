# Temporary, branch-scoped workflow to regenerate uv.lock with uv on Windows.
# Remove this workflow after its generated lockfile is committed.
name: Refresh security lockfile
on:
  push:
    branches:
      - fix/dependabot-security-2026-10-24
permissions:
  contents: write
jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.4"
      - name: Regenerate only affected packages
        run: uv lock --upgrade-package filelock --upgrade-package virtualenv
      - name: Verify lockfile
        run: uv lock --check
      - name: Verify security floors
        shell: pwsh
        run: |
          @'
          import tomllib
          with open("uv.lock", "rb") as f:
              lock = tomllib.load(f)
          versions = {p["name"]: p["version"] for p in lock["package"]}
          def parts(v): return tuple(map(int, v.split(".")))
          assert parts(versions["filelock"]) >= (4, 2, 4), versions["filelock"]
          assert parts(versions["virtualenv"]) >= (21, 14, 13), versions["virtualenv"]
          print("Security floors satisfied:", {n: versions[n] for n in ("filelock", "virtualenv")})
          '@ | uv run --no-sync python -
      - name: Commit regenerated lockfile
        shell: pwsh
        run: |
          if (git diff --quiet -- uv.lock) {
            Write-Output "Lockfile already current"
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- uv.lock
          git commit -m "Regenerate security-patched uv.lock"
          git push
