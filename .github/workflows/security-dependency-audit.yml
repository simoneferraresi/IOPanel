# Temporary verification; this file is removed from the proposed PR after review.
name: Independent dependency advisory audit
on:
  push:
    branches: [fix/dependabot-security-2026-10-24]
permissions:
  contents: read
jobs:
  pip-audit:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.4"
      - name: Export all resolved Python dependencies
        run: uv export --locked --all-groups --all-extras --no-default-groups --no-hashes --no-emit-project --output-file audit-requirements.txt
      - name: Audit all locked dependencies
        shell: pwsh
        run: |
          uvx --from pip-audit pip-audit --no-deps --disable-pip -r audit-requirements.txt -f json -o audit-lock.json
          $auditExit = $LASTEXITCODE
          if (Test-Path audit-lock.json) {
            $audit = Get-Content audit-lock.json -Raw | ConvertFrom-Json
            foreach ($dependency in $audit.dependencies) {
              foreach ($v in $dependency.vulns) {
                Write-Output "ADVISORY: $($dependency.name)==$($dependency.version) $($v.id) fix=$($v.fix_versions -join ',')"
              }
            }
          }
          if ($auditExit -ne 0) { throw "Dependency audit found advisories or failed (exit $auditExit)" }
      - name: Audit standalone icon tool requirements
        shell: pwsh
        run: |
          uvx --from pip-audit pip-audit --no-deps --disable-pip -r tools/icons/requirements-icon-tools.txt --progress-spinner off
