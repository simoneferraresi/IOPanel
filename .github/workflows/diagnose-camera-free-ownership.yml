name: Temporary camera-free CT400 test diagnostic

on:
  push:
    branches: [fix/isolate-unneeded-camera-startup-in-qt-tests]

permissions:
  contents: read

jobs:
  focused-ct400-ownership:
    runs-on: windows-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
      - run: uv sync --locked --no-default-groups --extra test
      - name: Diagnose isolated ownership test with early failure summary
        run: uv run --no-sync pytest -vv -x --tb=long -s tests/test_mainwindow_concurrent_simulated_acquisition.py::test_scan_owns_ct400_and_blocks_monitor_and_detector_writes
      - name: Diagnose ownership with preceding camera integration tests
        run: uv run --no-sync pytest -vv -x --tb=long tests/test_mainwindow_camera_integration.py tests/test_mainwindow_concurrent_simulated_acquisition.py
