name: Temporary generate Ruff uv.lock

on:
  push:
    branches: ["fix/ruff-0.17.1"]
    paths: ["pyproject.toml"]

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
      - run: uv lock --upgrade-package ruff
      - run: uv lock --check
      - uses: actions/upload-artifact@v7.0.0
        with:
          name: ruff-generated-lock
          path: uv.lock
          if-no-files-found: error
