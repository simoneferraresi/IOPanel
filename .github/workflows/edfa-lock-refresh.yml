name: Temporary EDFA lock refresh

on:
  push:
    branches: [feat/edfa-gpib-readonly-transport]

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
      - name: Resolve project lock with pinned uv
        run: |
          uv lock
          uv lock --check
      - name: Commit only the resolved uv.lock to this feature branch
        shell: bash
        run: |
          git add uv.lock
          if git diff --cached --quiet; then
            echo "Lockfile is already current"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Resolve pinned PyVISA in uv.lock"
          git push origin HEAD:refs/heads/feat/edfa-gpib-readonly-transport
