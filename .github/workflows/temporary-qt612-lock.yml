name: Temporary Qt 6.12 uv.lock generator
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-lock:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.13.4"
      - run: uv lock --upgrade-package pyside6 --upgrade-package pyside6-addons --upgrade-package pyside6-essentials --upgrade-package shiboken6
      - run: uv lock --check
      - name: Emit auditable Qt-specific lock entries for PR reconciliation
        shell: pwsh
        run: |
          $script = @'
          import json
          from pathlib import Path
          data = Path("uv.lock").read_text(encoding="utf-8")
          for name in ("pyside6", "pyside6-addons", "pyside6-essentials", "pyside6-pdf", "pyside6-webengine", "shiboken6"):
              start = data.index('[[package]]\\nname = "' + name + '"')
              end = data.find("\\n[[package]]", start + 4)
              if end == -1:
                  end = len(data)
              print("LOCK_PKG_" + name.upper().replace("-", "_") + "=" + json.dumps(data[start:end]))
          '@
          $script | python -
      - uses: actions/upload-artifact@v7.0.0
        with:
          name: qtpyside612-generated-lock
          path: uv.lock
          if-no-files-found: error
