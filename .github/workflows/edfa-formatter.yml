name: Temporary EDFA formatter

on:
  push:
    branches: [feat/edfa-gpib-readonly-transport]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
      - run: uv sync --locked --no-default-groups --extra lint
      - run: uv run --no-sync ruff check --fix config_model.py tools/edfa_readonly_probe.py hardware/ipg_ead2kc.py tests/test_edfa_gpib_transport.py tests/test_edfa_readonly_probe.py tests/test_config_model.py
      - run: uv run --no-sync ruff format config_model.py tools/edfa_readonly_probe.py hardware/ipg_ead2kc.py tests/test_edfa_gpib_transport.py tests/test_edfa_readonly_probe.py tests/test_config_model.py
      - run: git diff --check
      - name: Commit formatter-only code adjustments
        run: |
          git add config_model.py tools/edfa_readonly_probe.py hardware/ipg_ead2kc.py tests/test_edfa_gpib_transport.py tests/test_edfa_readonly_probe.py tests/test_config_model.py
          if git diff --cached --quiet; then
            echo "All files already formatted"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Apply Ruff formatting to EDFA M2 changes"
          git push origin HEAD:refs/heads/feat/edfa-gpib-readonly-transport
